<!DOCTYPE html>
<html lang="en" data-astryx-theme="stone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGantt</title>
<link rel="icon" type="image/svg+xml" href="/assets/opengantt/favicon.svg">
<link rel="stylesheet" href="/assets/opengantt/opengantt/main.css">
<style>
.og-boot {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  font-family: system-ui, sans-serif;
  color: #8a8580;
}
.og-boot-spinner {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid rgba(128, 128, 128, 0.25);
  border-top-color: #8a8580;
  animation: og-spin 0.8s linear infinite;
}
@keyframes og-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root">
  <div class="og-boot">
    <div class="og-boot-spinner"></div>
    <div>Loading OpenGantt…</div>
  </div>
</div>
<script>
window.csrf_token = "{{ csrf_token }}";
window.frappe_user = "{{ user }}";
</script>
<script src="/assets/opengantt/opengantt/main.js"></script>
</body>
</html>
